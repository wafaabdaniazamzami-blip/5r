 const mg=h('div','mg one'),L=h('div'),Rc=h('div','card'),lbh=h('b'),lb=h('div');Rc.append(lbh,h('div'),lb);Rc.style.display='none';mg.append(L,Rc);

function play(code,pid,mine,pname){clean();music(false);setTheme('night');$.classList.remove('wide');
 let B=null,st=0,doneN=0,scores=[],phase='wait',correct=0,wrong=0,streak=0,t0=0,limit=0,left=0,iv=null,sv=null,fin=false,allS=false,ansD=false,ansB=0,rkEl=null,ovEl=null;
 const hd=h('div','hdr'),prg=h('div','prg'),pi=h('i'),pl=h('b'),tp=h('div','tpill','00:00'),snb=h('button','s',SND?'🔊':'🔇'),mub=h('button','s',MUS?'🎵':'🔕');prg.append(pi,pl);hd.append(logo(true),prg,tp,snb,mub);hd.style.display='none';
 snb.onclick=()=>{SND=!SND;snb.textContent=SND?'🔊':'🔇'};mub.onclick=()=>{MUS=!MUS;mub.textContent=MUS?'🎵':'🔕';music(MUS&&phase==='play')};
 const me2=h('div','me2'),sc=h('div','pill','0 poin'),nmE=h('div','nm',pname);me2.append(av(mine,40),nmE,sc);me2.style.display='none';
 const bar=h('div','tb'),bi=h('i'),area=h('div'),lbc=h('div','card'),lbe=h('div'),wt=h('div','tiles');bar.appendChild(bi);bar.style.display='none';lbc.append(h('b','','🏆 Peringkat'),h('div'),lbe);
 $.replaceChildren(hd,me2,bar,h('div','rot','💡 Putar HP ke landscape supaya angka lebih besar'),area,lbc);
 const wc=h('div','card dn');wc.append(av(mine,110,true),h('div','hint',pname+', kamu sudah masuk! 🎉'),h('div','sub','Menunggu admin memulai…'),r5(),wt);area.appendChild(wc);
 const tot=()=>scores.reduce((a,b)=>a+(b||0),0),live=()=>Math.max(0,correct*10-wrong*5+ansB);
 const send=()=>{sv=null;api('saveScore',code,pid,scores,doneN,fin,streak).catch(()=>{})},sched=()=>{if(!sv)sv=setTimeout(send,1200)};
 const upd=()=>{scores[st]=live();sc.textContent=tot()+' poin'+(streak>=3?' 🔥'+streak:'');sched()};
 function runStage(){st=B.stage;hd.style.display=me2.style.display=bar.style.display='';pl.textContent='Tahap '+(st+1)+'/8';pi.style.width=(st+1)/8*100+'%';bi.style.width='100%';bar.classList.remove('low');
  const L=B.times[st]||10;tp.textContent='⏱ '+fmtT(L);const c=h('div','card dn'),cd=h('div','cd',3);
  c.append(h('div','sub','Tahap '+(st+1)+' • '+STG[st].n),h('div','hintw',STG[st].t),h('div','sub','Batas waktu '+L+' detik'),cd);area.replaceChildren(c);phase='cd';beep(440,.12);
  let n=3;const x=setInterval(()=>{n--;if(n<0){clearInterval(x);begin()}else{cd.textContent=n||'GO!';cd.style.animation='none';void cd.offsetWidth;cd.style.animation='';beep(n?440:880,.15)}},800);TM.push(x)}
 function begin(){if(phase!=='cd')return;phase='play';mUrg=false;mBpm=96+st*7;music(true);correct=wrong=streak=0;allS=ansD=false;ansB=0;limit=B.times[st]||10;t0=Date.now();
  const bd=mk(st,{hit(n,len){correct=n;streak++;upd();beep(600+Math.min(streak,10)*40,.07);if(n===len){allS=true;if(!ANS[st]||ansD)end(true)}},miss(){wrong++;streak=0;upd();beep(160,.18,'sawtooth');if(navigator.vibrate)navigator.vibrate(50)}});
  const wrap=[h('div','hintw',STG[st].t),toolbar(),bd];
  const A=ANS[st];if(A){const r=h('div','card'),fs=A.a.map((_,k)=>fld('❓',A.n>1?'Angka hilang #'+(k+1):'Angka yang tidak ada','numeric',2)),ab=h('button','','Kirim jawaban'),fb=h('div','sub');r.style.border='2px solid #ffcf33';
   ab.onclick=()=>{if(ansD)return;const v=fs.map(f=>+f.i.value);if(v.some(x=>!x))return;ansD=true;const used=new Set();let ok=0;v.forEach(x=>{if(A.a.includes(x)&&!used.has(x)){used.add(x);ok++}});ansB=Math.round(30/A.n*ok-10/A.n*(v.length-ok));fs.forEach(f=>f.i.disabled=true);ab.disabled=true;fb.textContent=ok===A.n?'✅ Benar semua! +30':ok?'⚠ Sebagian benar ('+ansB+')':'❌ Salah ('+ansB+')';upd();beep(ok?880:160,.2);if(allS)end(true)};
   r.append(h('b','','❓ '+A.q),...fs,ab,fb);wrap.splice(2,0,r)}
  area.replaceChildren(...wrap);fit(bd);
  iv=setInterval(()=>{left=limit-(Date.now()-t0)/1000;mBpm=96+st*7+(left<=10?34:0);mUrg=left<=10;bi.style.width=Math.max(0,left/limit*100)+'%';tp.textContent='⏱ '+fmtT(left);
   bar.classList.toggle('low',left<=Math.min(10,limit/3));if(left<=0)end(false)},100);TM.push(iv)}
 function end(all){clearInterval(iv);music(false);phase='res';doneN=st+1;streak=0;const bonus=all?Math.ceil(Math.max(0,left))*2:0;scores[st]=live()+bonus;fin=doneN>=8;send();sc.textContent=tot()+' poin';
  const show=()=>{if(ovEl){ovEl.remove();ovEl=null}if(phase!=='res')return;const big=h('div','bigsc','0'),c=h('div','card dn');
   if(fin){c.append(av(mine,120,true),h('div','stars','⭐ ⭐ ⭐'),h('div','hint','Kamu selesai!'))}else c.append(h('div','sub',all?'⚡ Semua selesai!':'⏰ Waktu habis'));
   c.append(h('div','sub','Nilai Tahap '+(st+1)),big,h('div','sub',`Benar ${correct} • Salah ${wrong}`+(bonus?` • Bonus waktu +${bonus}`:'')));
   if(ANS[st]){const A=ANS[st];c.appendChild(h('div','sub',ansD?(ansB>=30?'Jawaban angka hilang benar semua ✅':ansB>0?'Jawaban sebagian benar ⚠ (yang benar: '+A.a.join(' & ')+')':'Jawaban salah ❌ (yang benar: '+A.a.join(' & ')+')'):'Jawaban angka hilang tidak diisi (yang benar: '+A.a.join(' & ')+')'))}
   c.appendChild(h('div','hint',fin?'⏳ Menunggu peserta lain…':'⏳ Menunggu admin memulai Tahap '+(doneN+1)+'…'));area.replaceChildren(c);cu(big,scores[st]);if(all){confetti();beep(784,.2)}};

 const rank=()=>{if(!rkEl||!B)return;const L=[...B.players].sort((a,b)=>b.total-a.total),i=L.findIndex(p=>p.pid===pid);rkEl.textContent=i>=0?'Peringkat #'+(i+1)+' dari '+L.length+' peserta':''};
